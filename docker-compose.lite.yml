# Lite stack — just the API + Qdrant. No Postgres/Redis/Prometheus/Grafana
# (none are on the query/ingest code path). Suitable for a 1 GB free-tier box.
#
#   docker compose -f docker-compose.lite.yml up --build
#
# Set OPENAI_API_KEY in a .env file (or the shell) before running.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.lite
    container_name: insightrag-api-lite
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-prod}
      - EMBEDDING_PROVIDER=openai
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-1536}
      - ENABLE_RERANKER=false
      - ENABLE_PII_REDACTION=false
      - LLM_PROVIDER=openai
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - OPENAI_API_KEY=${OPENAI_API_KEY:?set OPENAI_API_KEY in your environment or .env}
      - API_KEY=${API_KEY:-}
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      qdrant:
        condition: service_started
    volumes:
      - app-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: insightrag-ui-lite
    ports:
      - "${UI_PORT:-8501}:8501"
    environment:
      - INSIGHTRAG_API_URL=http://api:8000
      - INSIGHTRAG_API_KEY=${API_KEY:-}
    depends_on:
      - api
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: insightrag-qdrant-lite
    # No host port published by default — only the API needs it. Uncomment to inspect.
    # ports:
    #   - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant-data:
  app-data:
