name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff & mypy
        run: pip install ruff==0.7.0 mypy==1.13.0
      - name: Ruff (lint + format check)
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/
      - name: Mypy (type check)
        run: mypy src/insightrag --ignore-missing-imports || true  # warn-only initially

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        env:
          OPENAI_API_KEY: test-key
        run: pytest --cov=src/insightrag --cov-report=xml --cov-report=term
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push (lite image — the deployed artifact)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.lite
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/insightrag:latest
            ghcr.io/${{ github.repository_owner }}/insightrag:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
