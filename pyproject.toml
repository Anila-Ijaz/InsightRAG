[project]
name = "insightrag"
version = "0.1.0"
description = "Production-grade RAG system for SEC 10-K financial filings"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Core API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1.3",

    # LLM clients
    "openai>=1.54.0",
    "anthropic>=0.39.0",
    "tiktoken>=0.8.0",

    # Retrieval & embeddings
    "sentence-transformers>=3.2.0",
    "qdrant-client>=1.12.0",
    "rank-bm25>=0.2.2",
    "torch>=2.4.0",
    "transformers>=4.45.0",
    "datasets>=3.0.0",
    "accelerate>=1.0.0",

    # Ingestion
    "unstructured[pdf]>=0.16.0",
    "pypdf>=5.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "sec-edgar-downloader>=5.0.3",
    "tenacity>=9.0.0",

    # Storage & infra
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "redis>=5.2.0",
    "boto3>=1.35.0",
    "celery>=5.4.0",

    # Observability
    "loguru>=0.7.2",
    "prometheus-client>=0.21.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",

    # Guardrails
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "ipykernel>=6.29.0",
]
eval = [
    "ragas>=0.2.0",
    "deepeval>=1.5.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insightrag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=src/insightrag --cov-report=term-missing"
